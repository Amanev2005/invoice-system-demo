<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-app-region: drag;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: #2d2d2d;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 300px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { 
            margin: 0 0 10px; 
            font-weight: 400;
            letter-spacing: 1px;
        }
        #status {
            font-size: 14px;
            color: #aaa;
            margin: 0;
            min-height: 1.2em;
        }
        .version {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 10px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Invoice System</h2>
        <p id="status">Initializing system...</p>
    </div>
    <div class="version">v1.0.0</div>

    <script>
        const { ipcRenderer } = require('electron');
        ipcRenderer.on('update-status', (event, message) => {
            document.getElementById('status').textContent = message;
        });
    </script>
</body>
</html>
