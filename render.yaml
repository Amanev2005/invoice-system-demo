services:
  # Backend Web Service
  - type: web
    name: invoice-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py migrate
    startCommand: gunicorn -c backend/gunicorn_config.py config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_ENGINE
        value: "postgresql"
      - key: DB_NAME
        fromDatabase:
          name: invoice-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: invoice-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: invoice-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: invoice-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: invoice-db
          property: port
      - key: SERVER_PORT
        value: "10000"

databases:
  - name: invoice-db
    databaseName: invoice_system
    user: invoice_user
    plan: free
